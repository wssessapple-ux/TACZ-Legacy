# TACZ-Legacy CI 编译守门
#
# 目标：在 push / PR 到 master 时，只做最小编译校验，拦截主源码编译不过的改动。
# 不跑客户端 / 服务端实例——1.12.2 客户端烟测需要图形环境与完整 MC 资源，不适合 GitHub Actions，
# 那部分仍由本地 scripts/runclient_smoke.sh 与维护者游戏内实测完成。
#
# 编译期依赖：
#   libs/playeranimator-1.12.2-1.0.2-rc1.jar 随仓库提供（compileOnly 编译期 API，不进产物 jar），
#   许可见 libs/LICENSE-PLAYERANIMATOR.md。

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  compile:
    name: 编译守门（main classes）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21（运行 Gradle）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # gradle.properties 里写的是本机 Windows JDK 绝对路径，CI 上不存在；
      # 这里把 wrapper 分发包地址换成官方源，并在下面命令行覆盖 java.home。
      - name: Use official Gradle distribution on CI
        run: >
          sed -i
          's#mirrors.cloud.tencent.com/gradle#services.gradle.org/distributions#'
          gradle/wrapper/gradle-wrapper.properties

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Compile main sources
        run: ./gradlew classes --no-daemon -Dorg.gradle.java.home=$JAVA_HOME
        env:
          GRADLE_OPTS: -Xmx3G

      # 单元测试暂未纳入 CI：现有用例部分依赖 RFG 运行期资源，需先在干净环境跑通后再放开。
      # 本地命令：./gradlew test
